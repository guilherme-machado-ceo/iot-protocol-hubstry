name: Deploy AWS

# Etapa 1: só disparo manual. O gatilho "push" na main será ligado
# depois da homologação, com aprovação explícita no circuito de revisão.
on:
  workflow_dispatch:
    inputs:
      deploy_dashboard:
        description: 'Publicar também o dashboard Streamlit no ECS (custo extra: 2ª tarefa Fargate)'
        type: boolean
        default: false
      snapshot:
        description: 'Snapshot do RDS antes da migração: auto (só se a migração for arriscada), sempre ou nunca'
        type: choice
        options: [auto, sempre, nunca]
        default: auto

concurrency:
  group: deploy-aws-production
  cancel-in-progress: false

# Permissões mínimas por padrão; o OIDC só é liberado no job que assume o papel.
permissions:
  contents: read

jobs:
  deploy:
    # O Environment "production" exige aprovação e só aceita a branch main.
    # Com Environment, o "sub" do token OIDC vira:
    #   repo:guilherme-machado-ceo/iot-protocol-hubstry:environment:production
    # A política de confiança do papel IAM deve usar exatamente esse valor.
    if: github.ref == 'refs/heads/main'
    environment: production
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      IMAGE_TAG: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # histórico completo para comparar migrações com o último deploy

      # Configuração de produção versionada no repositório (só identificadores,
      # nenhum segredo). Cada linha CHAVE=valor vira variável de ambiente do job.
      - name: Carregar configuração de produção
        run: |
          grep -E '^[A-Z_]+=' deploy/aws/producao.env >> "$GITHUB_ENV"
          grep -E '^[A-Z_]+=' deploy/aws/producao.env | cut -d= -f1 | tr '\n' ' '; echo

      - name: Credenciais AWS via OIDC (sem chave estática)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login no ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build e push — API e migração
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          docker build -f server/Dockerfile --target runtime \
            -t "$REGISTRY/$ECR_API_REPO:api-$IMAGE_TAG" server/
          docker build -f server/Dockerfile --target migrate \
            -t "$REGISTRY/$ECR_API_REPO:migrate-$IMAGE_TAG" server/
          docker push "$REGISTRY/$ECR_API_REPO:api-$IMAGE_TAG"
          docker push "$REGISTRY/$ECR_API_REPO:migrate-$IMAGE_TAG"

      # Snapshot condicionado ao risco: só quando há migração destrutiva ou que
      # reescreve dados desde o último deploy bem-sucedido (registrado no SSM).
      - name: Snapshot do RDS se a migração for arriscada
        id: snapshot
        env:
          MODO: ${{ inputs.snapshot }}
          DB_INSTANCE_ID: ${{ env.DB_INSTANCE_ID }}
          PARAM_ULTIMO_DEPLOY: /nautam/production/ultimo-deploy
        run: deploy/aws/snapshot-se-arriscado.sh

      - name: Registrar task definition da migração
        id: migrate_td
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          EXECUTION_ROLE_ARN: ${{ env.ECS_EXECUTION_ROLE_ARN }}
          TASK_ROLE_ARN: ${{ env.ECS_TASK_ROLE_ARN }}
          DATABASE_URL_SECRET_ARN: ${{ env.DATABASE_URL_SECRET_ARN }}
        run: |
          export MIGRATE_IMAGE="$REGISTRY/$ECR_API_REPO:migrate-$IMAGE_TAG"
          envsubst < deploy/aws/migrate-taskdef.json > /tmp/migrate-taskdef.json
          TD_ARN=$(aws ecs register-task-definition \
            --cli-input-json file:///tmp/migrate-taskdef.json \
            --query 'taskDefinition.taskDefinitionArn' --output text)
          echo "arn=$TD_ARN" >> "$GITHUB_OUTPUT"

      # Migração numa tarefa avulsa do ECS, dentro da VPC. As tarefas ficam em
      # sub-redes públicas (IP público, entrada restrita por security group);
      # o RDS não tem acesso público, então o runner nunca se conecta ao banco.
      # O script valida failures, container, stopCode e exitCode e mostra os logs.
      - name: Migração Prisma (tarefa ECS avulsa)
        env:
          TASK_DEFINITION_ARN: ${{ steps.migrate_td.outputs.arn }}
          SUBNETS: ${{ env.ECS_SUBNETS }}                  # ex.: subnet-a,subnet-b
          SECURITY_GROUPS: ${{ env.ECS_MIGRATE_SECURITY_GROUPS }}
        run: deploy/aws/run-migration.sh

      - name: Atualizar serviço da API (ECS Express Mode)
        id: api_deploy
        uses: aws-actions/amazon-ecs-deploy-express-service@v1
        with:
          service-name: ${{ env.ECS_API_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          image: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_API_REPO }}:api-${{ github.sha }}
          execution-role-arn: ${{ env.ECS_EXECUTION_ROLE_ARN }}
          infrastructure-role-arn: ${{ env.ECS_INFRASTRUCTURE_ROLE_ARN }}
          task-role-arn: ${{ env.ECS_TASK_ROLE_ARN }}
          container-port: 3001
          health-check-path: /api/readyz
          cpu: 256
          memory: 512
          min-task-count: 1
          max-task-count: 2
          subnets: ${{ env.ECS_SUBNETS }}
          security-groups: ${{ env.ECS_API_SECURITY_GROUPS }}
          # A action espera arrays JSON: name/value e name/valueFrom.
          environment-variables: >-
            [{"name":"NODE_ENV","value":"production"},
             {"name":"CORS_ORIGIN","value":"${{ env.CORS_ORIGIN }}"}]
          secrets: >-
            [{"name":"DATABASE_URL","valueFrom":"${{ env.DATABASE_URL_SECRET_ARN }}"}]

      - name: Teste pós-deploy (readiness)
        env:
          # Usa a URL pública configurada; na falta dela, o endpoint do ALB.
          BASE_URL: ${{ env.API_BASE_URL || steps.api_deploy.outputs.endpoint }}
        run: |
          test -n "$BASE_URL" || { echo "::error::URL da API desconhecida"; exit 1; }
          case "$BASE_URL" in http*) ;; *) BASE_URL="https://$BASE_URL" ;; esac
          for i in $(seq 1 30); do
            curl -sf "$BASE_URL/api/readyz" && exit 0
            sleep 10
          done
          echo "::error::API não ficou pronta em $BASE_URL"; exit 1

      - name: Registrar o commit implantado (referência para o próximo snapshot)
        run: |
          aws ssm put-parameter --name /nautam/production/ultimo-deploy --type String \
            --value "${{ github.sha }}" --overwrite >/dev/null
          echo "Último deploy: ${{ github.sha }} | snapshot pré-migração: ${{ steps.snapshot.outputs.snapshot }}"


      - name: Build e push — dashboard
        if: inputs.deploy_dashboard
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          docker build -f Dockerfile.dashboard -t "$REGISTRY/$ECR_DASHBOARD_REPO:$IMAGE_TAG" .
          docker push "$REGISTRY/$ECR_DASHBOARD_REPO:$IMAGE_TAG"

      - name: Atualizar serviço do dashboard (ECS Express Mode)
        if: inputs.deploy_dashboard
        uses: aws-actions/amazon-ecs-deploy-express-service@v1
        with:
          service-name: ${{ env.ECS_DASHBOARD_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          image: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_DASHBOARD_REPO }}:${{ github.sha }}
          execution-role-arn: ${{ env.ECS_EXECUTION_ROLE_ARN }}
          infrastructure-role-arn: ${{ env.ECS_INFRASTRUCTURE_ROLE_ARN }}
          container-port: 8501
          health-check-path: /_stcore/health
          cpu: 512
          memory: 1024
          min-task-count: 1
          max-task-count: 1
          subnets: ${{ env.ECS_SUBNETS }}
          security-groups: ${{ env.ECS_DASHBOARD_SECURITY_GROUPS }}
