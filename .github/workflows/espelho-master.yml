name: Espelho master

# A main é a única fonte da verdade. A master existe só como espelho somente
# leitura, porque o app do Streamlit Community Cloud
# (https://nautam-iot-protocol.streamlit.app/) está ligado a ela e o Streamlit
# não permite trocar a branch de um app publicado sem apagá-lo.
#
# Regra: ninguém faz commit direto na master. O push abaixo não usa --force:
# se a master divergir da main, o job falha em vez de sobrescrever trabalho.

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: espelho-master
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  espelhar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Atualizar master com a main (somente fast-forward)
        run: |
          git fetch origin master
          if ! git merge-base --is-ancestor origin/master HEAD; then
            echo "::error::A master divergiu da main. Verifique commits feitos direto na master antes de espelhar."
            git log --oneline HEAD..origin/master
            exit 1
          fi
          git push origin HEAD:refs/heads/master
          echo "master agora aponta para $(git rev-parse --short HEAD)"
