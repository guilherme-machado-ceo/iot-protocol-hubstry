name: API CI

on:
  push:
    branches: [ main ]
    paths:
      - 'server/**'
      - 'Dockerfile.dashboard'
      - 'dashboard.py'
      - 'requirements.txt'
      - 'constraints-dashboard.txt'
      - 'hpg_core/**'
      - 'deploy/aws/**'
      - '.github/workflows/api-ci.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'server/**'
      - 'Dockerfile.dashboard'
      - 'dashboard.py'
      - 'requirements.txt'
      - 'constraints-dashboard.txt'
      - 'hpg_core/**'
      - 'deploy/aws/**'
      - '.github/workflows/api-ci.yml'

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: nautam
        ports: [ '5432:5432' ]
        options: >-
          --health-cmd "pg_isready -U ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/nautam
      SHADOW_DATABASE_URL: postgresql://ci:ci@localhost:5432/shadow
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Instalar dependências (lockfile)
        run: npm ci

      - name: Gerar Prisma Client e validar schema
        run: |
          npx prisma validate
          npx prisma generate

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Fixtures de equivalência regeneradas a partir do núcleo Python
        working-directory: .
        run: |
          pip install -q -r requirements.txt -c constraints-dashboard.txt
          python3 server/tests/fixtures/gerar_fixtures_h16.py
          git diff --exit-code server/tests/fixtures/h16-python.json \
            || { echo "::error::O núcleo Python mudou: regenere server/tests/fixtures/h16-python.json e revise o porte TypeScript."; exit 1; }

      - name: Testes do script de snapshot por risco (aws simulado)
        working-directory: .
        run: bash deploy/aws/testes/testar-snapshot.sh

      - name: Typecheck, testes unitários e build
        run: |
          npm run typecheck
          npm test
          npm run build

      - name: Aplicar migrações num PostgreSQL limpo
        run: npx prisma migrate deploy

      - name: Verificar que as migrações batem com o schema (sem drift)
        run: |
          psql "postgresql://ci:ci@localhost:5432/nautam" -c "CREATE DATABASE shadow;"
          npx prisma migrate diff \
            --from-migrations prisma/migrations \
            --to-schema-datamodel prisma/schema.prisma \
            --shadow-database-url "$SHADOW_DATABASE_URL" \
            --exit-code

      - name: Smoke test de saúde e autenticação
        env:
          PORT: '3001'
          CORS_ORIGIN: http://localhost:3000
          NODE_ENV: production
        run: |
          trap 'echo "--- log da API"; cat /tmp/api.log' ERR
          node dist/index.js > /tmp/api.log 2>&1 &
          for i in $(seq 1 30); do curl -sf localhost:3001/api/livez && break; sleep 1; done
          curl -sf localhost:3001/api/livez
          curl -sf localhost:3001/api/readyz
          curl -sf localhost:3001/api/health

          code() { curl -s -o /dev/null -w '%{http_code}' "$@"; }
          REG='{"deviceId":"ci-device-1"}'
          URL=localhost:3001/api/devices/register

          # Sem chave: 401
          test "$(code -X POST $URL -H 'content-type: application/json' -d "$REG")" = 401
          # Chave malformada: 401
          test "$(code -X POST $URL -H 'x-api-key: nk_invalida' -H 'content-type: application/json' -d "$REG")" = 401

          # O job roda com NODE_ENV=production; as chaves de teste usam NODE_ENV=test,
          # único modo em que o CLI aceita imprimir a chave (--stdout).

          # Chave só de leitura: 403 na escrita, 200 na leitura
          RO=$(NODE_ENV=test npm run -s apikey -- create --name ci-leitura --scopes devices:read --stdout | jq -r .key)
          test "$(code -X POST $URL -H "x-api-key: $RO" -H 'content-type: application/json' -d "$REG")" = 403
          test "$(code localhost:3001/api/devices -H "x-api-key: $RO")" = 200

          # Chave de escrita: 201, também via Authorization: Bearer
          RW=$(NODE_ENV=test npm run -s apikey -- create --name ci-escrita --scopes devices:write --stdout | jq -r .key)
          test "$(code -X POST $URL -H "x-api-key: $RW" -H 'content-type: application/json' -d "$REG")" = 201
          test "$(code -X POST $URL -H "Authorization: Bearer $RW" -H 'content-type: application/json' -d "$REG")" = 201

          # Revogação: a chave deixa de valer
          npm run -s apikey -- revoke --prefix "$(echo "$RW" | cut -d_ -f2)"
          test "$(code -X POST $URL -H "x-api-key: $RW" -H 'content-type: application/json' -d "$REG")" = 401

          # Contrato H16 com chave de cálculo
          RC=$(NODE_ENV=test npm run -s apikey -- create --name ci-calculo --scopes harmonic:compute --stdout | jq -r .key)
          test "$(curl -sf localhost:3001/api/harmonic/hn -H "x-api-key: $RC" | jq .cardinality)" = 159
          curl -sf -X POST localhost:3001/api/harmonic/fft -H "x-api-key: $RC" -H 'content-type: application/json' -d '{}' \
            | jq -e '[.peaks[].closest_ratio] | sort == ["1/1","2/1","3/1","3/2","4/3","5/4"]'

          # /simulate exige harmonic:write; a chave de cálculo leva 403
          SIMB='{"harmonics":[{"a":3,"b":2}]}'
          SIMU=localhost:3001/api/harmonic/simulate
          test "$(code -X POST $SIMU -H "x-api-key: $RC" -H 'content-type: application/json' -d "$SIMB")" = 403
          RH=$(NODE_ENV=test npm run -s apikey -- create --name ci-simulacao --scopes harmonic:write --stdout | jq -r .key)
          curl -sf -X POST $SIMU -H "x-api-key: $RH" -H 'content-type: application/json' -d "$SIMB" \
            | jq -e '.components[0].ratio == "3/2"'
          test "$(code localhost:3001/api/harmonic/hn -H "x-api-key: $RH")" = 403

          # Em produção, o CLI recusa imprimir a chave (ela acabaria no CloudWatch Logs)
          # Fail-closed: --stdout só com NODE_ENV=test ou development
          if NODE_ENV=production npm run -s apikey -- create --name ci-prod --scopes devices:read --stdout; then
            echo "::error::CLI imprimiu chave com NODE_ENV=production"; exit 1
          fi
          if env -u NODE_ENV npm run -s apikey -- create --name ci-sem-env --scopes devices:read --stdout; then
            echo "::error::CLI imprimiu chave sem NODE_ENV definido"; exit 1
          fi

          npm run -s apikey -- list
          echo "Autenticação verificada."

  docker-images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build da imagem da API (runtime)
        run: docker build -f server/Dockerfile --target runtime -t nautam-api:ci server/

      - name: Build da imagem de migração
        run: docker build -f server/Dockerfile --target migrate -t nautam-migrate:ci server/

      # A imagem de migração precisa funcionar sozinha: aplica as migrações
      # num PostgreSQL limpo, na mesma rede Docker, como fará no ECS.
      - name: Smoke test da imagem de migração
        run: |
          docker network create migra
          docker run -d --name pg --network migra -e POSTGRES_USER=ci -e POSTGRES_PASSWORD=ci -e POSTGRES_DB=nautam postgres:16-alpine
          for i in $(seq 1 30); do docker exec pg pg_isready -U ci -d nautam && break; sleep 1; done
          docker run --rm --network migra -e DATABASE_URL=postgresql://ci:ci@pg:5432/nautam nautam-migrate:ci
          ESPERADAS=$(ls -d server/prisma/migrations/*/ | wc -l)
          APLICADAS=$(docker exec pg psql -U ci -d nautam -tAc 'SELECT count(*) FROM "_prisma_migrations" WHERE finished_at IS NOT NULL')
          test "$APLICADAS" = "$ESPERADAS" \
            || { echo "::error::a imagem de migração aplicou $APLICADAS de $ESPERADAS migrações"; exit 1; }

      - name: Build da imagem do dashboard
        run: docker build -f Dockerfile.dashboard -t nautam-dashboard:ci .

      - name: Smoke test do dashboard
        run: |
          docker run -d --name dash -p 8501:8501 nautam-dashboard:ci
          for i in $(seq 1 40); do curl -sf localhost:8501/_stcore/health && break; sleep 2; done
          curl -sf localhost:8501/_stcore/health || (docker logs dash; exit 1)

      # Varredura das imagens que vão para produção.
      # Bloqueia só vulnerabilidades CRÍTICAS com correção disponível;
      # as de severidade alta aparecem no relatório sem bloquear o merge.
      - name: Varredura de vulnerabilidades das imagens (Trivy)
        run: |
          # Versão fixada e SHA-256 conferido contra o valor gravado aqui (não contra
          # o arquivo de checksums do próprio release). Para atualizar, troque os dois.
          TRIVY_VERSAO=0.76.1
          TRIVY_SHA256=c7cbe3137fb8a48a17574bede3dd6beb16742d1e9772929940fc90082c39d9c0
          curl -sfL -o /tmp/trivy.tgz \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSAO}/trivy_${TRIVY_VERSAO}_Linux-64bit.tar.gz"
          echo "${TRIVY_SHA256}  /tmp/trivy.tgz" | sha256sum -c -
          sudo tar -xzf /tmp/trivy.tgz -C /usr/local/bin trivy
          trivy --version
          for img in nautam-api:ci nautam-migrate:ci nautam-dashboard:ci; do
            echo "::group::$img (CRITICAL e HIGH, relatório)"
            trivy image --quiet --ignore-unfixed --severity CRITICAL,HIGH --exit-code 0 "$img"
            echo "::endgroup::"
          done
          falhou=0
          for img in nautam-api:ci nautam-migrate:ci nautam-dashboard:ci; do
            trivy image --quiet --ignore-unfixed --severity CRITICAL --exit-code 1 "$img" >/dev/null \
              || { echo "::error::$img tem vulnerabilidade CRÍTICA com correção disponível"; falhou=1; }
          done
          exit $falhou
